<rect class="insert" x="30" y="248" width="131" height="2"/><rect class="insert" x="30" y="327" width="131" height="2"/><rect class="insert" x="94.5" y="250" width="2" height="77"/>
<g class="dimension"><path d="M 30 242 L 161 242"/><path d="M 28.5 240.5 l 3 3 M 159.5 240.5 l 3 3"/><text class="label" x="97.5" y="240">131 mm</text></g>
<g class="dimension"><path d="M 20 248 L 20 329"/><path d="M 18.5 246.5 l 3 3 M 18.5 327.5 l 3 3"/><text class="label" x="22" y="286.5">81 mm</text></g>
<text class="small" x="32" y="288.5">64.5</text><text class="small" x="98.5" y="288.5">64.5</text>
<text class="small" x="30" y="337">Bay widths above; clear depth 77 mm; rib 2 mm; height 18 mm</text>
