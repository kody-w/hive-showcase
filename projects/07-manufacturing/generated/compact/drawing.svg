<rect class="outline" x="30" y="178" width="140" height="28"/>
<path class="hidden" d="M 30 203 h 140"/>
<g class="dimension"><path d="M 179 178 L 179 206"/><path d="M 177.5 176.5 l 3 3 M 177.5 204.5 l 3 3"/><text class="label" x="181" y="190">28 mm</text></g>
<text class="small" x="33" y="200">floor 3 mm; wall 3 mm; rim recess 7 mm</text>
